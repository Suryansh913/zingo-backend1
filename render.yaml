# Render Blueprint for ZINGO (monorepo: backend at the repo root, React app in ./frontend).
# New Blueprint deploys create NEW services. For your existing services, apply the same settings in the dashboard (see DEPLOY.md).
databases:
  - name: zingo-db
    plan: free            # free Postgres expires after 30 days on Render - upgrade for real use
    databaseName: zingo
services:
  - type: web
    name: zingo-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: zingo-db, property: connectionString }
      - key: CORS_ALLOWED_ORIGINS            # your frontend origin(s), comma separated, no trailing slash
        value: https://zingo-frontend.onrender.com
      - key: RUN_MIGRATIONS                  # applies pending ADDITIVE migrations at start (see DEPLOY.md for backups)
        value: "1"
      - key: AWS_STORAGE_BUCKET_NAME         # S3-compatible storage for videos/photos (R2, S3, B2...). REQUIRED for uploads to survive deploys
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL             # R2/B2/MinIO endpoint; leave empty for AWS S3
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: DATE_LAUNCH_STATE               # restricted = staff only until age verification + moderation exist
        value: restricted
      - key: MATCH_LAUNCH_STATE
        value: restricted
  - type: web
    name: zingo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL                    # backend origin only: no trailing slash, no /api suffix
        value: https://zingo-backend-o11v.onrender.com
    routes:
      - type: rewrite                        # SPA fallback: /zings, /u/name, /date ... must serve index.html instead of 404
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
