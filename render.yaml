
# Render Blueprint for ZINGO
# Backend at repository root; React frontend in ./frontend.

databases:
  - name: zingo-db
    plan: free
    databaseName: zingo

services:
  - type: web
    name: zingo-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /healthz/

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: zingo-db
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        value: https://zingo-frontend.onrender.com

      - key: RUN_MIGRATIONS
        value: "1"

      # Cloudinary media storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: DATE_LAUNCH_STATE
        value: restricted

      - key: MATCH_LAUNCH_STATE
        value: restricted

  - type: web
    name: zingo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: VITE_API_URL
        value: https://zingo-backend-o11v.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
